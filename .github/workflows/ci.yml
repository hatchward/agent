name: CI

# Every push and pull request: lint the shell, run the fake-driven tests,
# build both images on amd64 under the plain docker driver and run smoke.sh
# against them. Release tags additionally publish multi-arch images to
# ghcr.io/hatchward/agent as :base, :claude, :base-<tag> and :claude-<tag>,
# pushed with the workflow's own GITHUB_TOKEN, then create the GitHub release
# from .github/releases/<tag>.md. bin/release is the way to cut a tag: it checks
# the version, the commit, CI and the notes before pushing.
#
# The tag trigger lives in this one workflow deliberately: a `paths:` filter
# and a `tags:` trigger in one push event evaluate paths unreliably on tag
# pushes, so this workflow has no path filter at all.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions: {}

env:
  IMAGE: ghcr.io/hatchward/agent

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run check

  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The docker driver puts `load: true` results in the daemon's image
      # store, the only place the Claude layer's FROM can find a base that is
      # not published yet.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Build the base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: agent:base-ci

      - name: Build the Claude image on top of it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: claude/Dockerfile
          push: false
          load: true
          tags: agent:claude-ci
          build-args: |
            BASE_IMAGE=agent:base-ci

      - name: Smoke test both images
        run: ./smoke.sh agent:base-ci agent:claude-ci

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Publish the base image
        id: base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:base
            ${{ env.IMAGE }}:base-${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-base
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache-base,mode=max

      # The Claude layer builds FROM the base by digest, so the two images
      # published under one tag are always the pair that was built together.
      - name: Publish the Claude image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: claude/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:claude
            ${{ env.IMAGE }}:claude-${{ github.ref_name }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}@${{ steps.base.outputs.digest }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-claude
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache-claude,mode=max

      # The GitHub release carries the notes bin/release checked for; the images
      # above are the artifacts, so nothing is uploaded here.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s ".github/releases/${TAG}.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file ".github/releases/${TAG}.md"
